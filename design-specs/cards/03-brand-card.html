<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card 03 · Brand card · AutoCava visual-specs</title>
<!--
  Card 03 · 品牌卡片
  适用场景：按品牌浏览入口 · 留资引导（"Hablar con un asesor" / "Ver"）
  基于：CAVI 品牌聚合页原型截图（2026-09-21 PM 提交）
  环境来源: https://www.autocava.com.mx/?ac_ab=stable「Explora por marca」模块（2026-09-21 核对）

  数据溯源（source · 2026-09-21 抓取首页 __NUXT_DATA__ · ac_ab=stable）：
  - MG: brandId 46 / logoUrl https://cdn.autocava.com.mx/brand/logo/046.jpg / 13 series
  - Toyota: brandId 79 / logoUrl https://cdn.autocava.com.mx/brand/logo/065.jpg
  - BYD: brandId 11 / logoUrl https://cdn.autocava.com.mx/brand/logo/011.jpg

  ⚠️ 已知差异（本 reference 与线上首页真实结构不完全一致）：
  1. 线上首页真实品牌卡文案为「品牌名 + N series」（如 "MG" + "13 series"），无副标题、无 CTA 按钮，点击整卡跳转 /auto/brand/{id}
  2. 「Descubre tu auto ideal」副标题 + 独立「Ver」按钮为设计探索变体，未在 autocava.com.mx 任何页面验证到该文案来源，标 [待PM确认]
  3. 本卡型可能对应未上线的 CAVI 内嵌品牌聚合场景，需 PM 确认具体入口页面

  Iconify CDN: https://code.iconify.design/3/3.1.0/iconify.min.js
  单文件自适应：PC ≥1024px / Mobile <1024px（AGENTS.md §368）
-->
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
<style>
  :root {
    --card-bg: #ffffff;
    --card-border: rgba(0, 0, 0, 0.06);
    --card-shadow: 0 4px 16px rgba(10, 25, 41, 0.06);
    --text-primary: #0a1929;
    --text-secondary: #6b7280;
    --gradient-brand: linear-gradient(135.81deg,
      #65c9ec 0%, #825aff 24.21%,
      #d750e8 48.42%, #f25ec7 72.63%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    background: #f5f6f8;
    color: var(--text-primary);
    padding: 40px 20px;
    min-height: 100vh;
  }

  /* Demo stack · PC 与移动各一份 */
  .demo-stack {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* === Brand Card · 横向布局 === */
  .brand-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: var(--card-shadow);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .brand-card:hover {
    box-shadow: 0 8px 24px rgba(10, 25, 41, 0.10);
    transform: translateY(-1px);
  }

  /* Logo · 48x48 · 灰底圆角 8px */
  .brand-logo {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border-radius: 8px;
    background: #f3f4f6;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .brand-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Body · 品牌名 + 副标 */
  .brand-body {
    flex: 1;
    min-width: 0;
  }
  .brand-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .brand-sub {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.3;
  }

  /* Right side · "Ver" 按钮 */
  .brand-action {
    flex-shrink: 0;
  }
  .btn-ver {
    min-width: 96px;
    height: 40px;
    padding: 0 24px;
    background: var(--card-bg);
    color: var(--text-primary);          /* 实心深色文字 · 保证可见 */
    border: 1.5px solid transparent;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    transition: opacity .15s ease;
    font-family: inherit;
    z-index: 0;
  }
  .btn-ver:hover { opacity: .85; }
  .btn-ver::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 999px;
    padding: 1.5px;
    background: var(--gradient-brand);
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  .demo-title {
    max-width: 720px;
    margin: 0 auto 24px;
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .demo-title strong {
    color: var(--text-primary);
    font-weight: 700;
  }

  /* === Mobile <1024px === */
  @media (max-width: 1023px) {
    .brand-card { padding: 14px 16px; gap: 12px; }
    .brand-logo { width: 44px; height: 44px; }
    .btn-ver { min-width: 80px; height: 36px; padding: 0 18px; font-size: 13px; }
  }
</style>
</head>
<body>

<p class="demo-title">
  <strong>Card 03 · Brand card</strong> · 品牌入口卡 · logo + 品牌名 + 副标 + 「Ver」按钮 · PC ≥1024px
</p>

<div class="demo-stack">

  <!-- Brand · MG -->
  <!-- source: __NUXT_DATA__ brandId=46, logoUrl · autocava.com.mx/?ac_ab=stable「Explora por marca」· 2026-09-21 -->
  <!-- source: [待PM确认] · 副标题「Descubre tu auto ideal」+「Ver」按钮为设计探索变体，线上真实文案为「13 series」无按钮 -->
  <div class="brand-card">
    <div class="brand-logo">
      <img src="https://cdn.autocava.com.mx/brand/logo/046.jpg" alt="MG">
    </div>
    <div class="brand-body">
      <div class="brand-name">MG</div>
      <div class="brand-sub">Descubre tu auto ideal</div>
    </div>
    <div class="brand-action">
      <button class="btn-ver">Ver</button>
    </div>
  </div>

  <!-- Brand · 示例 · Toyota（仅用于展示 layout 同款可复用）-->
  <!-- source: __NUXT_DATA__ brandId=79, logoUrl · autocava.com.mx/?ac_ab=stable「Explora por marca」· 2026-09-21 -->
  <div class="brand-card">
    <div class="brand-logo">
      <img src="https://cdn.autocava.com.mx/brand/logo/065.jpg" alt="Toyota">
    </div>
    <div class="brand-body">
      <div class="brand-name">Toyota</div>
      <div class="brand-sub">Descubre tu auto ideal</div>
    </div>
    <div class="brand-action">
      <button class="btn-ver">Ver</button>
    </div>
  </div>

  <!-- Brand · 示例 · BYD（仅用于展示 layout 同款可复用）-->
  <!-- source: __NUXT_DATA__ brandId=11, logoUrl · autocava.com.mx/?ac_ab=stable「Explora por marca」· 2026-09-21 -->
  <div class="brand-card">
    <div class="brand-logo">
      <img src="https://cdn.autocava.com.mx/brand/logo/011.jpg" alt="BYD">
    </div>
    <div class="brand-body">
      <div class="brand-name">BYD</div>
      <div class="brand-sub">Descubre tu auto ideal</div>
    </div>
    <div class="brand-action">
      <button class="btn-ver">Ver</button>
    </div>
  </div>

</div>

</body>
</html>
