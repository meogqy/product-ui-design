<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card 02 · Ranking 2x2 single CTA · AutoCava visual-specs</title>
<!--
  Card 02 · Ranking 2x2 + Ver detalles 单一 CTA
  适用场景：榜单 · 同车系多版本（如 Mazda CX-30 4 个 trim）紧凑展示
  基于：Cavi首页新价值导向调整/排行榜-autos-mas-vendidos.html v2 变体
  环境来源: https://www.autocava.com.mx/rank?ac_ab=stable（2026-09-21 核对）

  数据溯源（source · 2026-09-21 抓取 __NUXT_DATA__ · ac_ab=stable）：
  - Mazda CX-30 车系级: minPrice 451900 / maxPrice 585900 / seriesMinMonthlyPay 7524 / seriesMaxMonthlyPay 9755 / cntModel 4
    imageWhiteUrl https://cdn.autocava.com.mx/series/white/0302.png
  - #1 卡「I TA」起价 $7,524/mes 与 seriesMinMonthlyPay 一致 ✅ 真实
  - #2/#3/#4 卡（I SPORT $8,024 / GRAND TOURING $8,756 / SIGNATURE TA $9,755）：
    trim 名称与逐版本月供未在 /rank 榜单接口验证到，仅车系级 min/max 已核对；
    SIGNATURE TA $9,755 = seriesMaxMonthlyPay ✅ 可信；中间两档 [待PM确认]（未查询车系详情页 /auto/series/302 逐版本接口）

  Iconify CDN: https://code.iconify.design/3/3.1.0/iconify.min.js
  单文件自适应：PC ≥1024px / Mobile <1024px（AGENTS.md §368）
-->
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
<style>
  :root {
    --card-bg: #ffffff;
    --card-border: rgba(0, 0, 0, 0.06);
    --card-shadow: 0 4px 16px rgba(10, 25, 41, 0.06);
    --text-primary: #0a1929;
    --text-secondary: #6b7280;
    --price-emphasis: #f57c00;
    --badge-bg: #f3f4f6;
    --badge-text: #6b7280;
    --gradient-brand: linear-gradient(135.81deg,
      #65c9ec 0%, #825aff 24.21%,
      #d750e8 48.42%, #f25ec7 72.63%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    background: #f5f6f8;
    color: var(--text-primary);
    padding: 40px 20px;
    min-height: 100vh;
  }

  /* === 2x2 grid · 同卡型紧凑排列 === */
  .demo-grid {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* === Card === */
  .car-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: var(--card-shadow);
    padding: 20px;
    position: relative;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .car-card:hover {
    box-shadow: 0 8px 24px rgba(10, 25, 41, 0.10);
    transform: translateY(-1px);
  }

  .ranking-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: var(--badge-bg);
    color: var(--badge-text);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    margin-bottom: 12px;
  }

  .car-card__main {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .car-image {
    width: 88px;
    height: 88px;
    flex-shrink: 0;
    border-radius: 12px;
    background: #f3f4f6;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .car-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .car-card__body {
    flex: 1;
    min-width: 0;
    padding-top: 2px;
  }
  .car-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .car-price {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.3;
  }
  .car-price .price-emphasis {
    color: var(--price-emphasis);
    font-size: 22px;
    font-weight: 700;
    margin: 0 2px;
  }

  /* Full-width gradient CTA · Ver detalles */
  .car-card__actions {
    display: block;
  }
  .btn-gradient {
    width: 100%;
    height: 44px;
    background: var(--card-bg);
    color: var(--text-primary);   /* 实心深色文字 · 保证可见 */
    border: 1.5px solid transparent;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    z-index: 0;
    transition: opacity .15s ease;
    font-family: inherit;
  }
  .btn-gradient:hover { opacity: .85; }
  .btn-gradient::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 999px;
    padding: 1.5px;
    background: var(--gradient-brand);
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  .demo-title {
    max-width: 960px;
    margin: 0 auto 24px;
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .demo-title strong {
    color: var(--text-primary);
    font-weight: 700;
  }

  /* === Mobile <1024px === */
  @media (max-width: 1023px) {
    .demo-grid {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .car-card { padding: 16px; }
    .car-price .price-emphasis { font-size: 20px; }
  }
</style>
</head>
<body>

<p class="demo-title">
  <strong>Card 02 · Ranking 2x2 + Ver detalles</strong> · 同车系多 trim 紧凑展示 · PC ≥1024px
</p>

      </div>
      <div class="car-card__body">
        <!-- source: [待PM确认] · 逐 trim 月供未在 /rank 接口验证，需查询车系详情页确认 -->

        <div class="car-price">Desde: <span class="price-emphasis">$8,756</span>/mes</div>
      </div>
    </div>
    <div class="car-card__actions">
      <button class="btn-gradient">Ver detalles</button>

  </div>

  <!-- #4 Mazda CX-30 2026 SIGNATURE TA -->
  <div class="car-card">
    <span class="ranking-badge">#4</span>
    <div class="car-card__main">
      <div class="car-image">
        <!-- source: __NUXT_DATA__ imageWhiteUrl（车系级白底图，逐 trim 图未接口验证）· ac_ab=stable · 2026-09-21 -->
        <img src="https://cdn.autocava.com.mx/series/white/0302.png" alt="Mazda CX-30">
      </div>
      <div class="car-card__body">
        <!-- source: __NUXT_DATA__ seriesMaxMonthlyPay=9755 ✅ 与车系最高月供一致 · ac_ab=stable -->
        <div class="car-name">Mazda CX-30 2026 SIGNATURE TA</div>
        <div class="car-price">Desde: <span class="price-emphasis">$9,755</span>/mes</div>
      </div>
    </div>
    <div class="car-card__actions">
      <button class="btn-gradient">Ver detalles</button>

  </div>

</div>

</body>
</html>
