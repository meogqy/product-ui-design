<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card 01 · Ranking con tags + doble CTA · AutoCava visual-specs</title>
<!--
  Card 01 · Ranking con tags + doble CTA
  适用场景：排行榜 / 榜单（autos-mas-vendidos）单卡
  基于：Cavi首页新价值导向调整/排行榜-autos-mas-vendidos.html v1
  环境来源: https://www.autocava.com.mx/rank?ac_ab=stable（2026-09-21 核对）
  Iconify CDN: https://code.iconify.design/3/3.1.0/iconify.min.js
  单文件自适应：PC ≥1024px / Mobile <1024px（AGENTS.md §368）

  数据溯源（source · 2026-09-21 抓取 __NUXT_DATA__ · ac_ab=stable）：
  - Nissan Magnite: minPrice 374900 / maxPrice 456900 / seriesMinMonthlyPay 6242 / imageWhiteUrl https://cdn.autocava.com.mx/series/white/0351.png
  - Chevrolet Groove: minPrice 421500 / maxPrice 501400 / seriesMinMonthlyPay 7018 / imageWhiteUrl https://cdn.autocava.com.mx/series/white/0112.png

  ⚠️ 已知差异（本 reference 与线上 /rank 真实结构不完全一致，仅作卖点标签+双 CTA 卡型探索）：
  1. 线上真实 CTA 为单按钮「Planes de compra N versiones」，实心色 bg-ffcf20；本卡为演示「双 CTA + 渐变描边」设计变体，非线上复刻
  2. 线上排名徽章为悬浮图片外的胶囊（含销量 unidades）；本卡简化为卡内 #1/#2 徽章
  3. 卖点标签 pills（Interior refinado 等）未在 /rank stable 页面验证到来源，标 [待PM确认]
-->
<!-- source: [待PM确认] · 卖点标签 pills 内容 -->
<!-- source: [待PM确认] · 双 CTA 布局与渐变描边按钮为设计探索稿，非 autocava.com.mx 线上复刻 -->
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
<style>
  :root {
    /* Brand tokens · 与 DESIGN_CONSTRAINTS.md / SKILL.md 对齐 */
    --card-bg: #ffffff;
    --card-border: rgba(0, 0, 0, 0.06);
    --card-shadow: 0 4px 16px rgba(10, 25, 41, 0.06);
    --text-primary: #0a1929;
    --text-secondary: #6b7280;
    --price-emphasis: #f57c00;          /* orange · 起售价数字 */
    --badge-bg: #f3f4f6;
    --badge-text: #6b7280;
    --tag-bg: #f3f4f6;
    --tag-text: #4b5563;
    --btn-border: #e5e7eb;
    --gradient-brand: linear-gradient(135.81deg,
      #65c9ec 0%, #825aff 24.21%,
      #d750e8 48.42%, #f25ec7 72.63%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    background: #f5f6f8;
    color: var(--text-primary);
    padding: 40px 20px;
    min-height: 100vh;
  }

  /* Demo grid · 2 卡并排展示 PC，移动端单列 */
  .demo-grid {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  /* === Card === */
  .car-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: var(--card-shadow);
    padding: 20px;
    position: relative;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .car-card:hover {
    box-shadow: 0 8px 24px rgba(10, 25, 41, 0.10);
    transform: translateY(-1px);
  }

  /* Top row · 排名徽章 + chevron */
  .car-card__top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .ranking-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: var(--badge-bg);
    color: var(--badge-text);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
  }
  .chevron {
    color: #9ca3af;
    font-size: 14px;
    line-height: 1;
  }

  /* Main row · image + body */
  .car-card__main {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .car-image {
    width: 96px;
    height: 96px;
    flex-shrink: 0;
    border-radius: 12px;
    background: #f3f4f6;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .car-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .car-card__body {
    flex: 1;
    min-width: 0;
  }
  .car-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .car-price {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 2px;
    line-height: 1.3;
  }
  .car-price .price-emphasis {
    color: var(--price-emphasis);
    font-size: 24px;
    font-weight: 700;
    margin: 0 2px;
  }
  .car-price-range {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 12px;
  }

  /* Tags row */
  .tags-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tag-pill {
    background: var(--tag-bg);
    color: var(--tag-text);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    line-height: 1.4;
    white-space: nowrap;
  }

  /* Buttons row · 2 个 CTA */
  .car-card__actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .btn {
    height: 44px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s ease;
    font-family: inherit;
  }
  .btn:hover { opacity: .85; }
  .btn-plain {
    background: var(--card-bg);
    color: var(--text-primary);
    border: 1px solid var(--btn-border);
  }
  .btn-gradient {
    background: var(--card-bg);
    color: var(--text-primary);   /* 实心深色文字 · 保证可见 */
    border: 1.5px solid transparent;
    position: relative;
    z-index: 0;
  }
  .btn-gradient::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 999px;
    padding: 1.5px;
    background: var(--gradient-brand);
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  /* Page title (demo only · 不卡视觉删除) */
  .demo-title {
    max-width: 960px;
    margin: 0 auto 24px;
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .demo-title strong {
    color: var(--text-primary);
    font-weight: 700;
  }

  /* === Mobile <1024px === */
  @media (max-width: 1023px) {
    .demo-grid {
      grid-template-columns: 1fr;
    }
    .car-card {
      padding: 16px;
    }
    .car-price .price-emphasis {
      font-size: 20px;
    }
  }
</style>
</head>
<body>

<p class="demo-title">
  <strong>Card 01 · Ranking con tags + doble CTA</strong> · 排行榜 · 单卡含卖点标签 + 双 CTA · PC ≥1024px
</p>

<div class="demo-grid">

  <!-- Card 1 · Nissan Magnite -->
  <div class="car-card">
    <div class="car-card__top">
      <span class="ranking-badge">#1</span>

    </div>
    <div class="car-card__main">
      <div class="car-image">
        <!-- source: __NUXT_DATA__ imageWhiteUrl · autocava.com.mx/rank?ac_ab=stable · 2026-09-21 -->
        <img src="https://cdn.autocava.com.mx/series/white/0351.png" alt="Nissan Magnite">
      </div>
      <div class="car-card__body">
        <!-- source: __NUXT_DATA__ seriesMinMonthlyPay=6242 / minPrice=374900 / maxPrice=456900 · ac_ab=stable · 2026-09-21 -->
        <div class="car-name">Nissan Magnite</div>
        <div class="car-price">Desde: <span class="price-emphasis">$6,242</span>/mes</div>
        <div class="car-price-range">$374,900-$456,900</div>
        <!-- source: [待PM确认] · 卖点标签内容未在 autocava.com.mx 找到对应字段 -->
        <div class="tags-row">
          <span class="tag-pill">Interior refinado</span>
          <span class="tag-pill">Buena capacidad de carga</span>
          <span class="tag-pill">Conectividad</span>
        </div>
      </div>
    </div>
    <!-- source: [待PM确认] · 线上真实 CTA 为单按钮「Planes de compra N versiones」bg-ffcf20，此处双按钮+渐变描边为设计探索变体 -->
    <div class="car-card__actions">
      <button class="btn btn-plain">Precio mínimo</button>
      <button class="btn btn-gradient">Consultar planes</button>
    </div>
  </div>

  <!-- Card 2 · Chevrolet Groove -->
  <div class="car-card">
    <div class="car-card__top">
      <span class="ranking-badge">#2</span>
      <span class="iconify chevron" data-icon="lucide:chevron-right" data-width="14"></span>
    </div>
    <div class="car-card__main">
      <div class="car-image">
        <!-- source: __NUXT_DATA__ imageWhiteUrl · autocava.com.mx/rank?ac_ab=stable · 2026-09-21 -->
        <img src="https://cdn.autocava.com.mx/series/white/0112.png" alt="Chevrolet Groove">
      </div>
      <div class="car-card__body">
        <!-- source: __NUXT_DATA__ seriesMinMonthlyPay=7018 / minPrice=421500 / maxPrice=501400 · ac_ab=stable · 2026-09-21 -->
        <div class="car-name">Chevrolet Groove</div>
        <div class="car-price">Desde: <span class="price-emphasis">$7,018</span>/mes</div>
        <div class="car-price-range">$421,500-$501,400</div>
        <!-- source: [待PM确认] · 卖点标签内容未在 autocava.com.mx 找到对应字段 -->
        <div class="tags-row">
          <span class="tag-pill">Buena capacidad de carga</span>
          <span class="tag-pill">Conectividad</span>
          <span class="tag-pill">Cómodo</span>
        </div>
      </div>
    </div>
    <!-- source: [待PM确认] · 线上真实 CTA 为单按钮「Planes de compra N versiones」bg-ffcf20，此处双按钮+渐变描边为设计探索变体 -->
    <div class="car-card__actions">
      <button class="btn btn-plain">Precio mínimo</button>
      <button class="btn btn-gradient">Consultar planes</button>
    </div>
  </div>

</div>

</body>
</html>
